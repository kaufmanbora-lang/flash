# Flash — все серверные компоненты одной командой:
#   docker compose up -d --build
#
# Перед первым запуском создайте .env (см. .env.example) и задайте как минимум APP_SECRET и APP_URL.
# Для iPhone, камеры и push приложению нужен https: поставьте перед web любой прокси с сертификатом
# (Caddy, Traefik, Cloudflare Tunnel) — пример в README.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flash}
      POSTGRES_DB: flash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flash"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Приватное S3-совместимое хранилище видео. Наружу не публикуется: файлы отдаёт только приложение.
  storage-init:
    image: alpine:3
    restart: "no"
    volumes:
      - s3data:/data
    # RustFS работает от пользователя 10001 — том должен принадлежать ему.
    command: sh -c "chown -R 10001:10001 /data"

  storage:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-flash}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Задайте S3_SECRET_KEY в .env}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: .
    image: flash-app
    restart: unless-stopped
    command: ["npm", "run", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment: &app-env
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:?Задайте APP_SECRET в .env}
      INVITE_CODE: ${INVITE_CODE:-}
      DATABASE_URL: postgres://flash:${POSTGRES_PASSWORD:-flash}@postgres:5432/flash
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-flash}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-flash}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      STORAGE_QUOTA_GB: ${STORAGE_QUOTA_GB:-0}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FILM_CRF: ${FILM_CRF:-18}
      FILM_PRESET: ${FILM_PRESET:-fast}
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Отдельный долгоживущий процесс: обработка видео, монтаж FFmpeg, напоминания, фильм дня.
  worker:
    image: flash-app
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    depends_on:
      web:
        condition: service_started
    environment:
      <<: *app-env
      WORK_DIR: /tmp/flash-work
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  pgdata:
  s3data:
